<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de EPPs · Consumo de EPPs</title>
<link rel="stylesheet" href="css/estilos.css?v=1.1.0">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="logo">EPP</div>
    <div>
      <h1>Catálogo de EPPs</h1>
      <p>Administra los EPPs disponibles</p>
    </div>
  </div>
  <nav>
    <a href="index.html">Matriz</a>
    <a href="consumo.html">Consumo por persona</a>
    <a href="epps.html" class="activo">Catálogo EPPs</a>
    <a href="actualizar.html">Actualizar datos</a>
    <a href="uniformes.html">Matriz Uniformes</a>
    <a href="consumo_uniformes.html" class="activo">Consumo Uniformes</a>
    <a href="actualizar_uniformes.html">Actualizar Uniformes</a>
  </nav>
</header>

<main>
  <div id="cargando" class="card cargando">
    <div class="spinner"></div>
    Cargando catálogo…
  </div>

  <div id="app" class="oculto">
    <section class="card filtros" style="padding: 14px 18px; margin-bottom: 14px; display: flex; justify-content: space-between;">
      <div class="f-group" style="flex: 1; max-width: 400px;">
        <label for="f-buscar">Buscar EPP (Nombre o Código)</label>
        <input type="search" id="f-buscar" placeholder="Ej: Guante, 600000...">
      </div>
      <div class="f-group" style="justify-content: flex-end; margin-bottom: 2px; display: flex; gap: 8px;">
        <!-- ELIMINADO EL BOTÓN DE RECONCILIAR -->
        <button id="btn-ver-inactivos" class="btn-limpiar" type="button">Ver Inactivos</button>
        <button id="btn-nuevo-epp" class="btn-primario" type="button">+ Nuevo EPP</button>
      </div>
    </section>

    <div class="tabla-wrap" style="max-height:calc(100vh - 250px)">
      <table class="consumo">
        <thead>
          <tr>
            <th style="width: 130px; text-align: left;">Código</th>
            <th style="text-align: left;">Descripción</th>
            <th style="text-align: center; width: 80px;">Unidad</th>
            <th style="text-align: right; width: 120px;">Precio (S/)</th>
          </tr>
        </thead>
        <tbody id="cuerpo-epps"></tbody>
      </table>
    </div>
  </div>
</main>

<!-- MODAL PARA AGREGAR EPP -->
<div id="modal-epp" class="modal-overlay oculto">
  <div class="modal-content">
    <h2>Agregar Nuevo EPP</h2>
    
    <div class="f-group" style="margin-bottom: 12px;">
      <label>Código (Material)</label>
      <input type="text" id="add-material" placeholder="Ej: 6000000000">
    </div>
    
    <div class="f-group" style="margin-bottom: 12px;">
      <label>Descripción</label>
      <input type="text" id="add-descripcion" placeholder="Ej: CASCO DE SEGURIDAD">
    </div>
    
    <div class="f-group" style="margin-bottom: 12px;">
      <label>Familia</label>
      <select id="add-familia">
        <option value="1">Casco</option>
        <option value="2">Auditivo</option>
        <option value="3">Respirador</option>
        <option value="4">Lente</option>
        <option value="5">Guante</option>
        <option value="6">Bota</option>
        <option value="7">Soldadura</option>
        <option value="8">Ropa</option>
        <option value="9">Arnés</option>
        <option value="10">Otros</option>
      </select>
    </div>
    
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <div class="f-group" style="flex: 1;">
        <label>Unidad</label>
        <input type="text" id="add-unidad" value="UN">
      </div>
      <div class="f-group" style="flex: 1;">
        <label>Precio (S/)</label>
        <input type="number" step="0.01" id="add-precio" value="0.00">
      </div>
    </div>
    
    <div style="display: flex; justify-content: flex-end; gap: 10px;">
      <button id="btn-cancelar-add" class="btn-limpiar" type="button">Cancelar</button>
      <button id="btn-guardar-add" class="btn-primario" type="button">Guardar EPP</button>
    </div>
  </div>
</div>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/epps.js"></script>
</body>
</html>
